    <meta name="description" content="Find Indian government schemes you may qualify for. Ask in English, Hindi or Tamil. Data from MyScheme.gov.in." />
    <meta name="theme-color" content="#0b2447" />
    <title>SchemeBot – Government Scheme Assistant</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('gsa_theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
